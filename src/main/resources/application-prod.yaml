jwt:
  # No fallback here on purpose — if JWT_SECRET isn't set in the prod
  # environment, Spring fails fast at startup with a clear "could not
  # resolve placeholder" error, rather than silently running with the
  # dev-only default from application.yaml.
  secret: ${JWT_SECRET}

app:
  cookie-secure: true # required once served over HTTPS — see RefreshCookieUtil
  frontend-url: ${FRONTEND_URL}
  cors:
    # Exact origins only. Include the HTTPS frontend and the published
    # chrome-extension://<extension-id> origin as a comma-separated value.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
